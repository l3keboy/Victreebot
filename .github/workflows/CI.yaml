name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run first
  release_metadata:
    runs-on: ubuntu-latest
    environment: QA
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
      # Checkout repository
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Extract version from pyproject.toml
        id: release_version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Ensure version is new
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="${{ steps.release_version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error ::Version in pyproject.toml ($VERSION) already has a Git tag."
            exit 1
          fi

  # Run second
  linting:
    runs-on: ubuntu-latest
    environment: QA
    permissions:
      contents: read
    needs: [release_metadata]
    steps:
      # Checkout repository
      - uses: actions/checkout@v5

      # Setup python + uv
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Install project
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # Mypy
      - name: Validate mypy typing
        run: uv run mypy victreebot

      # Pyright
      - name: Validate pyright typing
        run: uv run pyright

      # Ruff
      - name: Check formatting
        run: uv run ruff format --check
      - name: Check linting
        run: uv run ruff check

  # Run third (only on merge)
  create_release_on_merge:
    runs-on: ubuntu-latest
    environment: QA
    permissions:
      contents: write
    needs: [release_metadata, linting]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Create GitHub release
      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.release_metadata.outputs.version }}
          name: Release ${{ needs.release_metadata.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}