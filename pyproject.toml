[project]
name = "victreebot"
version = "1.0.4"
description = "Pokémon Go! Raidbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioscheduler>=1.4.2",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "greenlet>=3.5.6",
    "hvac[parser]>=2.4.0",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation>=0.66b1",
    "opentelemetry-instrumentation-aiohttp-client>=0.66b1",
    "opentelemetry-instrumentation-asgi>=0.66b1",
    "opentelemetry-instrumentation-asyncio>=0.66b1",
    "opentelemetry-instrumentation-asyncpg>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-instrumentation-urllib3>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pyfiglet>=1.0.4",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "sqlmodel>=0.0.48",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",
    "colorama>=0.4.6",
    "hikari[speedups]>=2.5.0",
    "hikari-lightbulb>=3.2.2",
    "apscheduler>=3.11.3",
    "pokebase==1.4.1",
    "hikari-sake>=1.1.2",
    "pillow>=13.0.0",
    "python-dateutil>=3.0.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pyright>=1.1.407",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.5",
    "ty>=0.0.1a27",
    "types-colorama>=0.4.15.20250801",
    "types-hvac>=2.4.0.20251115",
    "types-python-dateutil>=2.9.0.20260807",
]


# TODO Remove later when reworking Victreebot.core
[tool.black]
line-length = 120

[tool.isort]
profile = "black"
force_single_line = true

[tool.mypy]
# general settings
strict = true
mypy_path = "typings"
check_untyped_defs = true
incremental = true
namespace_packages = true
no_implicit_optional = true
pretty = true
python_version = "3.10"
show_column_numbers = true
show_error_codes = true
show_error_context = true

# stuff to allow
allow_untyped_globals = false
allow_redefinition = true

# stuff to disallow
disallow_untyped_decorators = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

# warnings
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
